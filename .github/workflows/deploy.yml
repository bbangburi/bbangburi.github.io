name: Publish BBANGBURI site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Unpack public site
        run: unzip -q slime-steal-site.zip -d build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/github-pages
      - uses: actions/deploy-pages@v4
        id: deployment
